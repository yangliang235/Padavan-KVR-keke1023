name: Build MT7621 NETGEAR-BZV (keke1023)

on:
  repository_dispatch:
  workflow_dispatch:

env:
  TNAME: "NETGEAR-BZV"

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
    - name: Checkout
      uses: actions/checkout@main

    - name: Initialization environment
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo apt-get update
        sudo apt-get install unzip libtool-bin curl cmake gperf gawk flex bison nano xxd \
        fakeroot kmod cpio git python3-docutils gettext automake autopoint \
        texinfo build-essential help2man pkg-config zlib1g-dev libgmp3-dev \
        libmpc-dev libmpfr-dev libncurses5-dev libltdl-dev wget libc-dev-bin
        sudo mkdir -p /mnt/opt
        sudo chown $USER:$USER /mnt/opt

    - name: Clone source code
      run: |
        mkdir -p /mnt/opt/rt-n56u
        sudo rm -rf /opt/rt-n56u
        ln -s /mnt/opt/rt-n56u /opt/rt-n56u
        git clone --depth=1 --single-branch https://github.com/yangliang235/Padavan-KVR-keke1023.git /opt/rt-n56u
        
        # 基础修改
        sed -i 's/192.168.2/192.168.6/g' /opt/rt-n56u/trunk/user/shared/defaults.h
        sed -i 's/ntp1.aliyun.com/time.pool.aliyun.com/g' /opt/rt-n56u/trunk/user/shared/defaults.h

        ################################################################################################
        # 1. 替换 Logo（假设你的 logo.png 在仓库根目录）
        ################################################################################################
        if [ -f "$GITHUB_WORKSPACE/logo.png" ]; then
          cp -vpf "$GITHUB_WORKSPACE/logo.png" /opt/rt-n56u/trunk/user/www/n56u_ribbon_fixed/bootstrap/img/asus_logo.png
          echo "Logo replaced."
        else
          echo "WARNING: logo.png not found in repo root, skip logo replacement."
        fi

        ################################################################################################
        # 2. 修改固件版本号后缀（3.4.3.9-9_YYYYMMDD）
        ################################################################################################
        FW_DATE=$(date +"%Y%m%d")
        sed -i "s/^FIRMWARE_BUILDS_REV=.*/FIRMWARE_BUILDS_REV=${FW_DATE}/" /opt/rt-n56u/trunk/versions.inc
        grep -n "FIRMWARE_BUILDS_REV" /opt/rt-n56u/trunk/versions.inc || true

        ################################################################################################
        # 3. 隐藏一级菜单中的 VPN 服务器 / VPN 客户端（state.js）
        ################################################################################################
        STATE_JS="/opt/rt-n56u/trunk/user/www/n56u_ribbon_fixed/state.js"
        sed -i 's|^menuL1_title *= new Array.*|menuL1_title = new Array("", "<#menu1#>", "", "", "", "<#menu4#>", "<#menu5_8#>", "<#menu5#>");|' "$STATE_JS"
        sed -i 's|^menuL1_link *= new Array.*|menuL1_link = new Array("", "index.asp", "", "", "", "Main_TrafficMonitor_realtime.asp", "Advanced_System_Info.asp", "as.asp");|' "$STATE_JS"
        grep -n '^menuL1_title\|^menuL1_link' "$STATE_JS" || true

        ################################################################################################
        # 4. 尝试在 Advanced_WAN_Content.asp 中启用 SFE 选项
        # 此分支可能已移除该界面选项，以下 sed 命令为通用尝试，若无效需手动检查源码
        ################################################################################################
        WAN_ASP="/opt/rt-n56u/trunk/user/www/n56u_ribbon_fixed/Advanced_WAN_Content.asp"
        if [ -f "$WAN_ASP" ]; then
          # 尝试取消被注释的 shortcut-fe 相关代码块
          sed -i 's|<!--.*shortcut.*-->||g' "$WAN_ASP"
          sed -i 's|<!--.*sfe.*-->||g' "$WAN_ASP"
          echo "=== SFE related lines in Advanced_WAN_Content.asp ==="
          grep -i -n "shortcut\|sfe" "$WAN_ASP" || echo "No SFE/shortcut found in ASP file."
        fi

        cd /opt/rt-n56u/toolchain-mipsel
        sh dl_toolchain.sh
        mkdir -p /opt/images/

    - name: Build Firmware
      run: |
        echo "FILE_DATE=-$(date +"%Y%m%d%H%M")" >> $GITHUB_ENV
        CONFIG_SRC=""
        if [ -f "$GITHUB_WORKSPACE/$TNAME/$TNAME.config" ]; then
          CONFIG_SRC="$GITHUB_WORKSPACE/$TNAME/$TNAME.config"
        elif [ -f "/opt/rt-n56u/trunk/configs/templates/$TNAME.config" ]; then
          CONFIG_SRC="/opt/rt-n56u/trunk/configs/templates/$TNAME.config"
        fi
        if [ -z "$CONFIG_SRC" ]; then
          echo "ERROR: No config found for $TNAME."; exit 1
        fi
        echo "Using config: $CONFIG_SRC"
        cp -vpf "$CONFIG_SRC" /opt/rt-n56u/trunk/.config
        cd /opt/rt-n56u/trunk

        # 超频
        INIT_C="linux-3.4.x/arch/mips/rt2880/init.c"
        if [ -f "$INIT_C" ]; then
        sed -i 's/!= 0x2B2)/!= 0x3B2)/g; s/(0x2B2);/(0x3B2);/g; s/0x2B2/0x3B2/g' "$INIT_C"
        sed -i 's/!= 0xc2)/!= 0x3B2)/g; s/(0xc2);/(0x3B2);/g; s/0xC2/0x3B2/g' "$INIT_C"
        sed -i 's/0x2b2/0x3B2/g; s/0x2C2/0x3B2/g; s/0x2c2/0x3B2/g; s/0x362/0x3B2/g' "$INIT_C"

        echo "=== init.c PLL lines after patch ==="
        grep -n "0x3B2\|0x2B2\|0xc2\|0xC2" "$INIT_C" || true
        else
        echo "ERROR: $INIT_C not found."; exit 1
        fi

        sed -i '/CONFIG_FIRMWARE_CPU_900MHZ/d; /CONFIG_FIRMWARE_MT7621_OC/d; /CONFIG_FIRMWARE_INCLUDE_OC/d' .config
        echo "CONFIG_FIRMWARE_INCLUDE_OC=y" >> .config
        echo 'CONFIG_FIRMWARE_MT7621_OC="0x3B2"' >> .config
        # e2fsprogs 修复
        E2FS_DIR="user/e2fsprogs/e2fsprogs-1.46.5"
        if [ -f "$E2FS_DIR/MCONFIG" ]; then
          sed -i 's|^CC=.*|CC = /opt/rt-n56u/toolchain-mipsel/toolchain-3.4.x/bin/mipsel-linux-uclibc-gcc|' "$E2FS_DIR/MCONFIG"
          sed -i 's|^PTHREAD_CFLAGS=.*|PTHREAD_CFLAGS = -pthread|' "$E2FS_DIR/MCONFIG" || true
        fi
        export PTHREAD_CFLAGS="-pthread"

        # 清理可选插件
        for opt in SHADOWSOCKS V2RAY TROJAN SSOBFS XRAY SRELAY ADBYBY KOOLPROXY ADGUARDHOME DNSFORWARDER ZEROTIER ALIDDNS DDNSTO MENTOHUST SCUTCLIENT GDUT_DRCOM DOGCOM MINIEAP NJIT_CLIENT TRANSMISSION TRANSMISSION_WEB_CONTROL ARIA ARIA_WEB_CONTROL MINIDLNA XUPNPD FIREFLY CADDY CADDYBIN WYY WYYBIN OPENVPN SSWAN SOFTETHERVPN_SERVER SOFTETHERVPN_CLIENT SOFTETHERVPN_CMD VLMCSD TTYD LRZSZ HTOP NANO IPERF3 MTR SOCAT SMBD SMBD36 WINS SMBD_SYSLOG FTPD LPRD U2EC EAP_PEAP SFTP TCPDUMP HDPARM PARTED CURL XFRM QOS IMQ IFB IPSET NFSD NFSC CIFS NAPT66 XFS FUSE SWAP HID AUDIO UVC SERIAL DROPBEAR DROPBEAR_FAST_CODE RPL2TP DUMP1090 RTL_SDR FRPC FRPS TUNSAFE; do
          sed -i "/CONFIG_FIRMWARE_INCLUDE_${opt}=/d; /CONFIG_FIRMWARE_ENABLE_${opt}=/d" .config
          sed -i 's/CONFIG_FIRMWARE_INCLUDE_SHADOWSOCKS=y/CONFIG_FIRMWARE_INCLUDE_SHADOWSOCKS=n/g' .config
          sed -i 's/CONFIG_FIRMWARE_INCLUDE_XRAY=y/CONFIG_FIRMWARE_INCLUDE_XRAY=n/g' .config
          sed -i 's/CONFIG_FIRMWARE_INCLUDE_V2RAY=y/CONFIG_FIRMWARE_INCLUDE_V2RAY=n/g' .config
          sed -i 's/CONFIG_FIRMWARE_INCLUDE_TROJAN=y/CONFIG_FIRMWARE_INCLUDE_TROJAN=n/g' .config
          sed -i 's/CONFIG_FIRMWARE_INCLUDE_SSOBFS=y/CONFIG_FIRMWARE_INCLUDE_SSOBFS=n/g' .config
          sed -i 's/CONFIG_FIRMWARE_INCLUDE_PACKAGE_SS_RELY=y/CONFIG_FIRMWARE_INCLUDE_PACKAGE_SS_RELY=n/g' .config
          sed -i 's/CONFIG_FIRMWARE_INCLUDE_OPENVPN=y/CONFIG_FIRMWARE_INCLUDE_OPENVPN=n/g' .config
          sed -i 's/CONFIG_FIRMWARE_INCLUDE_WIREGUARD=y/CONFIG_FIRMWARE_INCLUDE_WIREGUARD=n/g' .config
          sed -i 's/CONFIG_FIRMWARE_INCLUDE_SSSERVER=y/CONFIG_FIRMWARE_INCLUDE_SSSERVER=n/g' .config
          sed -i 's/CONFIG_FIRMWARE_INCLUDE_SRELAY=y/CONFIG_FIRMWARE_INCLUDE_SRELAY=n/g' .config
          sed -i 's/CONFIG_FIRMWARE_INCLUDE_CLASH=y/CONFIG_FIRMWARE_INCLUDE_CLASH=n/g' .config
          sed -i 's/CONFIG_FIRMWARE_INCLUDE_SHORTCUT_FE=n/CONFIG_FIRMWARE_INCLUDE_SHORTCUT_FE=y/g' .config
          sed -i 's/CONFIG_FIRMWARE_INCLUDE_FASTPATH_HWNAT=n/CONFIG_FIRMWARE_INCLUDE_FASTPATH_HWNAT=y/g' .config
          sed -i 's/CONFIG_FIRMWARE_INCLUDE_IPV6=n/CONFIG_FIRMWARE_INCLUDE_IPV6=y/g' .config
          sed -i 's/CONFIG_FIRMWARE_INCLUDE_HTTPS=n/CONFIG_FIRMWARE_INCLUDE_HTTPS=y/g' .config
        done

        # 显式开启功能
        echo "CONFIG_RT_DOT11K_RRM=y" >> .config
        echo "CONFIG_RT_DOT11R_FT=y" >> .config
        echo "CONFIG_RT_DOT11V_WNM=y" >> .config
        echo "CONFIG_FIRMWARE_INCLUDE_SMARTDNS=y" >> .config
        echo "CONFIG_FIRMWARE_INCLUDE_SMARTDNSBIN=y" >> .config
        echo "CONFIG_FIRMWARE_INCLUDE_LANG_CN=y" >> .config
        echo "CONFIG_FIRMWARE_ENABLE_USB=y" >> .config
        echo "CONFIG_FIRMWARE_ENABLE_UFSD=y" >> .config
        echo "CONFIG_FIRMWARE_ENABLE_FAT=y" >> .config
        echo "CONFIG_FIRMWARE_ENABLE_EXT4=y" >> .config
        echo "CONFIG_FIRMWARE_INCLUDE_USBIP=y" >> .config
        echo "CONFIG_FIRMWARE_INCLUDE_LPRD=y" >> .config
        echo "CONFIG_FIRMWARE_INCLUDE_U2EC=y" >> .config
        echo "CONFIG_FIRMWARE_INCLUDE_HTTPS=y" >> .config
        echo "CONFIG_FIRMWARE_INCLUDE_OPENSSL_EC=y" >> .config
        echo "CONFIG_FIRMWARE_INCLUDE_OPENSSH=y" >> .config
        echo "CONFIG_FIRMWARE_INCLUDE_SHORTCUT_FE=y" >> .config
        echo "CONFIG_FIRMWARE_INCLUDE_FASTPATH_HWNAT=y" >> .config
        echo "CONFIG_FIRMWARE_INCLUDE_IPV6=y" >> .config
        echo "CONFIG_FIRMWARE_INCLUDE_HTTPS=y" >> .config
        echo "CONFIG_FIRMWARE_WEBUI_HIDE_VPN=y" >> .config

        ./clear_tree_simple
        fakeroot ./build_firmware_modify $TNAME 0
        mv -f images/*.trx /opt/images
        cp -vpf .config /opt/images

    - name: Upload artifact
      uses: actions/upload-artifact@main
      with:
        name: Padavan-MT7621-${{ env.TNAME }}-C${{ env.FILE_DATE }}
        path: /opt/images
